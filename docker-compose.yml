services:
  academic-cv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academic-cv-dev
    ports:
      - "1314:1313"
    volumes:
      # Mount content, config, layouts, assets for hot-reload
      - ./content:/app/content
      - ./config:/app/config
      - ./layouts:/app/layouts
      - ./assets:/app/assets
      - ./data:/app/data
      - ./i18n:/app/i18n
      - ./static:/app/static
      # Persist node_modules to avoid reinstalling on every run
      - node_modules:/app/node_modules
      # Persist downloaded Hugo/Go modules across container recreations
      - hugo_cache:/root/.cache/hugo_cache
    environment:
      # Disable fast render for cleaner debug output in terminal
      HUGO_DISABLEFASTRENDER: "1"
      # Ensure no Go dependency issues
      CGO_ENABLED: "0"
    working_dir: /app
    # Use the host-facing URL when Hugo generates absolute language links.
    command:
      - hugo
      - server
      - --ignoreVendorPaths
      - --disableFastRender
      - --bind
      - 0.0.0.0
      - --port
      - "1313"
      - --baseURL
      - http://localhost:1314/academic-cv/
      - --noHTTPCache
      - --minify
      - --enableGitInfo

volumes:
  node_modules:
  hugo_cache:
